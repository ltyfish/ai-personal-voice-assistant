name: Release JARVIS Desktop

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-desktop
  cancel-in-progress: true

jobs:
  desktop:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      GROQ_API_KEY: ci-build-placeholder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Install desktop dependencies
        run: npm --prefix desktop ci

      - name: Test desktop
        run: npm --prefix desktop test

      - name: Typecheck desktop
        run: npm --prefix desktop run typecheck

      - name: Check Electron wiring
        run: node scripts/check-desktop-electron.mjs

      - name: Build web runtime
        run: npm run build

      - name: Set release version
        shell: pwsh
        run: npm --prefix desktop version "0.1.${{ github.run_number }}" --no-git-tag-version

      - name: Build and publish Windows release
        run: npm --prefix desktop run build -- --publish always
